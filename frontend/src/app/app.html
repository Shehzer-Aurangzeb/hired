<a
  href="#main"
  class="btn btn-outline sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50"
>
  Skip to content
</a>

<!-- Two instances of this app side by side, one holding real applications, is
     exactly how someone edits the wrong one. -->
@if (demo()) {
  <p
    class="bg-warn text-ink-fg sticky top-0 z-40 flex items-center justify-center gap-2 px-3 py-1 text-center text-[12px] font-medium"
    role="status"
  >
    <app-icon name="alert" [size]="14" />
    Demo mode. The profile and applications below are invented, and nothing is saved.
  </p>
}

@if (auth.authenticated()) {
  <header
    class="border-line bg-raised sticky top-0 z-30 flex h-12 items-center gap-1 border-b px-3"
  >
  <!-- Wordmark hides first on narrow screens; nav labels matter more. -->
  <span class="text-fg mr-3 hidden text-[15px] font-semibold tracking-tight sm:block">hired</span>

    @if (profile.exists()) {
      <nav class="flex min-w-0 items-center gap-0.5" aria-label="Main">
    @for (item of nav; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="!bg-surface !text-fg"
        class="text-fg-muted hover:bg-surface hover:text-fg flex h-8 items-center gap-1.5 rounded-md px-2.5 text-[13px] font-medium transition-colors duration-150"
      >
        <app-icon [name]="item.icon" [size]="15" />
        {{ item.label }}
      </a>
    }
      </nav>
    } @else {
      <span class="text-fg-subtle text-[12px]">Setting up</span>
    }

    <button type="button" class="btn btn-ghost ml-auto !min-h-8 !px-2" (click)="signOut()" title="Sign out">
      <app-icon name="log-out" [size]="15" />
      <span class="sr-only">Sign out</span>
    </button>
  </header>
}

<main id="main" tabindex="-1" class="min-h-0 flex-1 overflow-y-auto">
  <router-outlet />
</main>

<app-toast-host />
